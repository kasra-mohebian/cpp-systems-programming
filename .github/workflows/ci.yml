name: Build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, compiler: gcc, cc: gcc, cxx: g++, mode: Debug}
          - {os: ubuntu-latest, compiler: gcc, cc: gcc, cxx: g++, mode: Release}
          - {os: ubuntu-latest, compiler: clang, cc: clang, cxx: clang++, mode: Debug}
          - {os: macos-15-intel, compiler: clang, cc: clang, cxx: clang++, mode: Debug}
          - {os: macos-15-intel, compiler: clang, cc: clang, cxx: clang++, mode: Release}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/cppstudy_demo
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCPPSTUDY_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  thread-sanitizer:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DCPPSTUDY_THREAD_SANITIZER=ON
      - run: cmake --build build-tsan --parallel 2
      - run: ctest --test-dir build-tsan -R concurrency --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1
